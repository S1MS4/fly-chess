<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#302e2b">
  <title>fly-chess</title>
  <link rel="icon" href="img/fly.svg">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.js" } }</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-flag" viewBox="0 0 24 24"><path fill="currentColor" d="M5 2.5h2v19H5zM8 3.5h11.5l-2.8 4.75L19.5 13H8z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M9 5.5 3.5 11 9 16.5M4.5 11H14a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5a7 7 0 0 0-4.2 12.6c.7.5 1.2 1.3 1.2 2.2v.7h6v-.7c0-.9.5-1.7 1.2-2.2A7 7 0 0 0 12 1.5z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M9.5 19.6h5M10.5 22.3h3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 4.5v15M4.5 12h15"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.5v16m0 0-3.5-3.5m3.5 3.5 3.5-3.5M16.5 20.5v-16m0 0L13 8m3.5-3.5L20 8"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 3.5v12m0 0-5-5m5 5 5-5M4.5 20h15"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path fill="currentColor" d="M3 20h18v2H3zM5 11h3.5v7H5zM10.25 5h3.5v13h-3.5zM15.5 8.5H19V18h-3.5z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="currentColor" d="M2.5 5.2c0-.9.7-1.6 1.7-1.5 2.6.2 5 .9 6.8 2.3v14.6c-1.9-1.3-4.3-2-6.9-2.2a1.7 1.7 0 0 1-1.6-1.7zM21.5 5.2c0-.9-.7-1.6-1.7-1.5-2.6.2-5 .9-6.8 2.3v14.6c1.9-1.3 4.3-2 6.9-2.2a1.7 1.7 0 0 0 1.6-1.7z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM4 3l16 18"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-knight" viewBox="0 0 24 24"><path fill="currentColor" d="M8.2 21.5c-.4-3.6.9-6 3.3-7.9.3-.2.2-.5-.1-.5-1.6.3-3 1.2-4 2.4-.7.8-1.9.8-2.6.1l-.9-.9c-.5-.5-.6-1.4-.1-2l5.2-6.5c.3-.4.4-.9.3-1.4L9 2.5c2.6.2 4.6 1.5 5.4 3.4 4.1 1.1 6.4 5.3 5.9 10.2l-.6 5.4z"/></symbol>
  </svg>

  <nav id="nav" aria-label="Main">
    <a class="logo" href="./"><img src="img/fly.svg" alt="" width="32" height="32"><span translate="no">fly-chess</span></a>
    <a class="item play" href="./" aria-current="page" title="Play" aria-label="Play"><svg aria-hidden="true"><use href="#i-knight"/></svg><span>Play</span></a>
    <button class="item training" id="train-btn" type="button" title="Training" aria-label="Training"><svg aria-hidden="true"><use href="#i-chart"/></svg><span>Training</span></button>
    <a class="item about" href="https://github.com/S1MS4/fly-chess#readme" target="_blank" rel="noopener" title="How it works" aria-label="How it works"><svg aria-hidden="true"><use href="#i-book"/></svg><span>How it works</span></a>
  </nav>

  <main id="main">
    <section id="play" aria-label="Board">
      <div class="player" id="top-player"></div>
      <div id="board-wrap">
        <div id="board" class="board"></div>
        <div id="result" hidden>
          <div class="result-card" role="dialog" aria-labelledby="result-title" aria-describedby="result-reason">
            <button class="result-close" id="result-close" type="button" title="Look at the board" aria-label="Close and look at the board"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
            <h2 id="result-title"></h2>
            <p id="result-reason"></p>
            <div class="result-players" id="result-players"></div>
            <div class="result-actions">
              <button class="btn-green" id="result-rematch" type="button">Rematch</button>
              <button class="btn" id="result-new" type="button">New game</button>
            </div>
          </div>
        </div>
      </div>
      <div class="player" id="bottom-player"></div>
    </section>

    <aside id="panel" aria-label="Game">
      <header class="panel-head"><img src="img/fly.svg" alt="" width="30" height="30"><h1>Play the fly</h1></header>

      <div id="setup" class="panel-body">
        <div class="bot-hero">
          <span class="avatar portrait" id="hero-avatar"></span>
          <p class="bubble" id="hero-bubble"></p>
        </div>
        <div class="bot-title"><span id="hero-name"></span><span id="hero-elo"></span></div>
        <p class="bot-stat" id="hero-stat"></p>
        <div class="bot-box" id="fly-box" role="radiogroup" aria-label="Which fly"></div>
      </div>
      <footer id="setup-foot" class="panel-foot">
        <div class="setup-row">
          <span>I play as</span>
          <div class="side-grid" role="radiogroup" aria-label="Your colour">
            <button data-side="w" role="radio" type="button" title="White"><span class="king white"></span></button>
            <button data-side="r" role="radio" type="button" title="Random"><span class="king random"></span></button>
            <button data-side="b" role="radio" type="button" title="Black"><span class="king black"></span></button>
          </div>
        </div>
        <label class="setup-row" id="imagine-row" title="Before each move the fly looks at the board after each of its own moves, one move and no further: it plays a mate, skips a draw while it's winning, and lets its value readout judge the rest. No search: it never looks at your replies.">
          <span>Imagination <small>one move ahead</small></span>
          <input class="switch" id="imagine" type="checkbox">
        </label>
        <button class="btn-green big" id="play-btn" type="button">Play</button>
        <button class="btn-green big" id="back-btn" type="button" hidden>Continue</button>
      </footer>

      <div id="game" class="panel-body" hidden>
        <div id="chat">
          <span class="avatar" id="chat-avatar"></span>
          <div id="bubbles" aria-live="polite"></div>
        </div>

        <section class="card" id="brain-card">
          <header>
            <h2>Inside the fly</h2>
            <span id="step-label">waiting for a move</span>
            <button class="icon-btn fold" id="brain-fold" type="button" aria-expanded="true" aria-controls="brain-body" title="Hide the brain" aria-label="Hide the brain"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
          </header>
          <div class="brain-body" id="brain-body">
            <div class="brain-view">
              <canvas id="brain" title="Every dot is a neuron. Drag to turn it"></canvas>
              <p class="brain-legend"><i class="more"></i>more <i class="less"></i>less active</p>
            </div>
            <div class="brain-side">
              <ul id="regions" aria-label="How much each region's firing changed"></ul>
              <input id="step" type="range" min="0" max="11" value="11" aria-label="Step of the think">
            </div>
          </div>
        </section>

        <section class="card" id="guess-card">
          <header>
            <div class="tabs" role="group" aria-label="Whose move the guesses are for">
              <button id="tab-fly" type="button" aria-pressed="true" title="What the fly was choosing between for its last move">Fly considered</button>
              <button id="tab-you" type="button" aria-pressed="false" title="What the fly expects you to play">Fly expects</button>
            </div>
            <span id="guess-value" hidden title="The fly's own rating of its position when it chose this move: -1 lost, +1 won"></span>
            <button class="icon-btn" id="blur" type="button" aria-pressed="false" aria-label="Blur the guesses" title="Blur the guesses. What it expects you to play is basically a hint, so blur it if that feels like cheating"><svg aria-hidden="true"><use href="#i-eye"/></svg></button>
          </header>
          <p id="guess-title"></p>
          <ol id="guesses" translate="no"></ol>
        </section>

        <section id="moves-card">
          <div id="opening"><svg aria-hidden="true"><use href="#i-book"/></svg><span id="opening-name">Starting position</span><div id="accuracy"></div></div>
          <div id="history" role="list" aria-label="Moves" translate="no"></div>
        </section>
      </div>
      <footer id="game-foot" class="panel-foot" hidden>
        <div class="big-row" id="play-buttons">
          <button id="resign" type="button" title="Resign"><svg aria-hidden="true"><use href="#i-flag"/></svg><span>Resign</span></button>
          <button id="takeback" type="button" title="Take back your last move"><svg aria-hidden="true"><use href="#i-undo"/></svg><span>Takeback</span></button>
          <button id="hint" type="button" title="Hint: Stockfish's best move"><svg aria-hidden="true"><use href="#i-bulb"/></svg><span>Hint</span></button>
        </div>
        <div class="big-row two" id="over-buttons" hidden>
          <button class="btn-green" id="rematch" type="button">Rematch</button>
          <button id="new-game" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg><span>New game</span></button>
        </div>
        <div class="small-row">
          <button id="new" type="button" title="New game" aria-label="New game"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button id="flip" type="button" title="Flip the board (F)" aria-label="Flip the board"><svg aria-hidden="true"><use href="#i-flip"/></svg></button>
          <button id="prev" type="button" title="Previous move (←)" aria-label="Previous move"><svg aria-hidden="true"><use href="#i-prev"/></svg></button>
          <button id="next" type="button" title="Next move (→)" aria-label="Next move"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
          <button id="pgn" type="button" title="Download the game as PGN" aria-label="Download the game as PGN"><svg aria-hidden="true"><use href="#i-download"/></svg></button>
        </div>
      </footer>
    </aside>
  </main>

  <div id="training" hidden>
    <div class="sheet" role="dialog" aria-labelledby="training-title">
      <header><h2 id="training-title">How the flies trained</h2><button class="icon-btn" id="train-close" type="button" title="Close" aria-label="Close the training charts"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
      <p class="muted">Every run in runs/, refreshed every 10 seconds while this is open. Hover for the numbers.</p>
      <div id="charts"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
